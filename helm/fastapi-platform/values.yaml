user-service:
  replicaCount: 1
  image:
    repository: sakthivel31/user-service
    pullPolicy: Always
    tag: v5
  service:
    type: ClusterIP
    port: 8001
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi
  vpa:
    enabled: false
    updateMode: "Recreate"

    minAllowed:
      cpu: 50m
      memory: 128Mi

    maxAllowed:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

    scaleUp:
      stabilizationWindowSeconds: 0

    scaleDown:
      stabilizationWindowSeconds: 30
    
 
  
order-service:
  replicaCount: 1
  image:
    repository: sakthivel31/order-service
    pullPolicy: Always
    tag: latest
  service:
    type: ClusterIP
    port: 8002
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

    limits:
      cpu: 500m
      memory: 512Mi

postgresql:
  replicaCount: 1

  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    name: postgres-service

  database:
    name: postgres
    user: Sakthivel_P
    password: root
    userDatabase: user_db
    orderDatabase: order_db
   

  secret:
    name: postgres-secret
    usernameKey: POSTGRES_USER
    passwordKey: POSTGRES_PASSWORD
    userDatabaseKey: USER_DB_NAME
    orderDatabaseKey: ORDER_DB_NAME

  initConfig:
    name: postgres-init-config
    mountPath: /config

  init:
    enabled: true

  storage:
    claimName: postgres-pvc
    mountPath: /var/lib/postgresql/data
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  initScripts:
    mountPath: /init-scripts
    containerMountPath: /docker-entrypoint-initdb.d

  initContainer:
    image: busybox:1.36

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 5

  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    

ingress:
  enabled: true

  tls:
    enabled: true
    secretName: fastapi-tls

  hosts:
    - host: api.test2.local
      paths:
        - path: /users
          pathType: Prefix
        - path: /orders
          pathType: Prefix
