
apiVersion: v1
kind: Secret

metadata:
  name: {{ .Values.secret.name }}
  namespace: fastapi-app

type: Opaque

stringData:
  POSTGRES_USER: {{ .Values.database.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  USER_DB_NAME: {{ .Values.database.userDatabase | quote }}
  ORDER_DB_NAME: {{ .Values.database.orderDatabase | quote }}
