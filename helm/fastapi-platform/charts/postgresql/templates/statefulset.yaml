apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      initContainers:
        - name: copy-init-sql
          image: {{ .Values.initContainer.image }}
          command:
            - sh
            - -c
            - |
              echo "Copying SQL initialization file..."
              cp /config/init.sql /init-scripts/init.sql
              echo "SQL file copied successfully"
          volumeMounts:
            - name: init-config
              mountPath: {{ .Values.initConfig.mountPath }}
              readOnly: true
            - name: init-scripts
              mountPath: {{ .Values.initScripts.mountPath }}

      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.passwordKey }}
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-storage
              mountPath: {{ .Values.storage.mountPath }}
            - name: init-scripts
              mountPath: {{ .Values.initScripts.containerMountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user | quote }}
                - -d
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.user | quote }}
                - -d
                - {{ .Values.database.name | quote }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ .Values.storage.claimName }}
        - name: init-config
          configMap:
            name: {{ .Values.initConfig.name }}
        - name: init-scripts
          emptyDir: {}