
replicaCount: 1

image:
  repository: sakthivel31/order-service
  tag: latest
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8002
  targetPort: 8002
  protocol: TCP

configMap:
  name: order-service-config
  data:
    DATABASE_HOST: postgres-service
    DATABASE_PORT: "5432"
    DATABASE_NAME: "order_db"
    USER_SERVICE_URL: "http://user-service:8001"


secret:
  name: order-service-secret
  data:
    DATABASE_USER: "Sakthivel_P"
    DATABASE_PASSWORD: "root"


postgres:
  host: postgres-service
  port: 5432
  wait:
    enabled: true
    image: busybox:1.36

livenessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  enabled: true
  path: /health
  port: 8002
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70


