apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: fastapi-ingress
  namespace: fastapi-app

spec:
  ingressClassName: nginx

  rules:
    - host: api.test2.local
      http:
        paths:
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8001

          - path: /orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8002