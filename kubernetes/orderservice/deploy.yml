apiVersion: apps/v1
kind: Deployment

metadata:
  name: order-service
  namespace: fastapi-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-service 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is available"

      containers:
        - name: order-service
          image: sakthivel31/order-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8002


          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          env:
            - name: USER_SERVICE_URL
              valueFrom:
                    configMapKeyRef:
                      name: order-service-config
                      key: USER_SERVICE_URL

          envFrom:
            - configMapRef:
                name: order-service-config

            - secretRef:
                name: order-service-secret

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi
